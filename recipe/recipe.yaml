schema_version: 1

context:
  name: pystencils
  version: "1.3.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/mabau/pystencils/archive/release/${{ version }}.tar.gz
  sha256: e80cbcb1dc91e2c0246eb96fd583a4ba753bb9febc079527c028acd3cf4d57b9

build:
  number: 2
  skip: match(python, "<3.10")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools
    - cython
    - versioneer
  run:
    - appdirs
    - joblib
    - numpy >=1.8.0
    - python
    - sympy <=1.11.1,>=1.6
    - pyyaml

tests:
  - python:
      imports:
        - pystencils
        - pystencils.backends
      pip_check: true

about:
  license: AGPL-3.0-or-later
  license_file: COPYING.txt
  summary: Run blazingly fast stencil codes on numpy arrays.
  description: |
    pystencils uses sympy to define stencil operations, that can be
    executed on numpy arrays. Exploiting the stencil structure makes
    pystencils run faster than normal numpy code and even as Cython and
    numba, as demonstrated in this notebook.
  homepage: https://i10git.cs.fau.de/pycodegen/pystencils/
  repository: https://i10git.cs.fau.de/pycodegen/pystencils/
  documentation: https://i10git.cs.fau.de/pycodegen/pystencils/

extra:
  recipe-maintainers:
    - jan-janssen
